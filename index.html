<!doctype html>
<html>
    <head>
        <title>Wizard Of Arc</title>
<meta content="width=device-width, initial-scale=1" name="viewport" />
<meta charset="UTF-8" />
<link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico" />
<link rel="stylesheet" type="text/css" href="/css/vars.css" />
<link rel="stylesheet" type="text/css" href="/css/sitewide.css" />
<link rel="stylesheet" type="text/css" href="/css/index.css" />

    </head>
    <body>

    <div class="header-image" id="woa_logo"></div>
    <div class="header-image" id="woa_words" alt="WizardOfArc Words"></div>
    <h1 class="subtitle">Weaving The Threads of Chaos into The Cozy Blanket that is Music</h1>
        <div class="footer">
    <a href="/">
        <style>
            .woa-home-button {
                width: 100px;
                height: 75px;
                margin: auto;
                margin-bottom: 20px;
                position: relative;
                background-image: url("../images/woa_logo_only.svg");
                @media (prefers-color-scheme: dark) {
                    background-image: url("../images/woa_logo_only_light.svg");
                }
            }
            .tooltiptext {
            position: absolute;
            width: 75px;
            visibility: hidden;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-weight: bolder;
            text-align: center;
            padding: 5px 0;
            border-radius: 6px;
            z-index: 1;
            }

            .woa-home-button:hover .tooltiptext {
            visibility: visible;
            }
            </style>
        <div class="woa-home-button">
            <span class="tooltiptext">Home</span>
        </div>
    </a>
    <ul>
        <li><a class="footer-link" href="&#x2F;about.html">About</a></li>
        <li><a class="footer-link" href="&#x2F;music.html">Music</a></li>
        <li><a class="footer-link" href="&#x2F;grimoire.html">The Grimoire</a></li>
        <li><a class="footer-link" href="&#x2F;contact.html">Contact</a></li>
    </ul>
    <script>
         let tooltiptext = document.querySelector(".tooltiptext");
         let homebutton = document.querySelector(".woa-home-button");
         homebutton.addEventListener("mousemove", event => {
            tooltiptext.style.left = `${event.offsetX}px`;
            tooltiptext.style.top = `${event.offsetY}px`;
         });
         homebutton.addEventListener("mouseenter", event => {
            tooltiptext.style.left = `${event.offsetX}px`;
            tooltiptext.style.top = `${event.offsetY}px`;
         });
    </script>
</div>
</body>
</html>
